<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 md:p-10 border border-gray-100 flex flex-col">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-700 to-pink-600 mb-2">Lumina</h1>
            <h2 class="text-3xl font-bold text-gray-800">Welcome Back</h2>
            <p class="text-sm text-gray-500 mt-1">Please enter your details to sign in.</p>
        </div>
        
        <form class="gap-5 flex flex-col">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" placeholder="Email" 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:bg-white focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" placeholder="••••••••" 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:bg-white focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
                <div class="flex justify-end mt-2">
                    <a href="#" class="text-sm font-medium text-purple-600 hover:text-purple-500 hover:underline">Forgot password?</a>
                </div>
            </div>

            <a href="index.html" class="text-center select-none w-full py-3 bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold rounded-lg shadow-md hover:shadow-lg hover:opacity-90 transition-all duration-200">
               Login
            </a>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-xs uppercase">Or continue with</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <button type="button" class="flex items-center justify-center py-2.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="h-5 w-5" alt="Google">
                </button>
                <button type="button" class="flex items-center justify-center py-2.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="h-5 w-5" alt="Facebook">
                </button>
                <button type="button" class="flex items-center justify-center py-2.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                    <img src="https://www.svgrepo.com/show/475689/twitter-color.svg" class="h-5 w-5" alt="Twitter">
                </button>
            </div>

        </form>

        <p class="text-center text-sm text-gray-500 mt-8">
            Don't have an account? 
            <a href="signup.html" class="font-bold text-purple-600 hover:text-purple-500 hover:underline">Sign up</a>
        </p>
    </div>

</body>
</html>
